[package]
name = "mdkb"
version = "0.1.0"
edition = "2024"
description = "Local markdown knowledge base with semantic search"
license = "MIT"
repository = "https://github.com/user/mdkb"
readme = "README.md"
keywords = ["markdown", "knowledge-base", "search", "mcp"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "mdkb"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
zerocopy = { version = "0.7", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "1"

# Frontmatter parsing
gray_matter = "0.2"

# Async (for MCP)
tokio = { version = "1", features = ["full"] }

# MCP protocol
rmcp = { version = "0.14", features = ["server", "transport-io"] }

# HTTP server (for MCP HTTP transport)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }

# File watching
notify = "6"
notify-debouncer-mini = "0.4"

# Errors
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Allocator (M-USE-ALLOCATOR-OPTIMIZED)
mimalloc = "0.1"

# Utilities
sha2 = "0.10"
walkdir = "2"
glob = "0.3"
globset = "0.4"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"

# Markdown parsing
pulldown-cmark = "0.12"
regex = "1"

# LLM - semantic search with local embeddings
llama-cpp-2 = "0.1"
hf-hub = "0.3"
indicatif = "0.17"

# Token counting for usage metrics
tiktoken-rs = "0.6"

# Code intelligence - search backend
tantivy = { version = "0.25.0", optional = true }

# Code intelligence - tree-sitter parsing
tree-sitter = { version = "0.26.5", optional = true }
tree-sitter-rust = { version = "0.24.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-c = { version = "0.24.1", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-c-sharp = { version = "0.23.1", optional = true }
tree-sitter-kotlin-codanna = { version = "0.3.9", optional = true }
tree-sitter-php = { version = "0.24.2", optional = true }
tree-sitter-swift = { version = "0.7.1", optional = true }
tree-sitter-lua = { version = "0.4.1", optional = true }
tree-sitter-gdscript = { version = "6.1.0", optional = true }

# Code intelligence - indexing pipeline
crossbeam-channel = { version = "0.5", optional = true }
ignore = { version = "0.4", optional = true }
rayon = { version = "1.10", optional = true }

# Code intelligence - semantic search with local embeddings
fastembed = { version = "4", optional = true }

# HTTP server auth (constant-time token comparison)
subtle = { version = "2", optional = true }

# HTTPS server (self-signed certs)
rcgen = { version = "0.13", optional = true }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23", features = ["ring"], default-features = false, optional = true }

[features]
default = []
llm = []  # Enable LLM-powered features like memory condense
http-server = ["dep:axum", "dep:tower", "dep:tokio-util", "dep:subtle", "rmcp/transport-streamable-http-server"]
https-server = ["http-server", "dep:rcgen", "dep:axum-server", "dep:rustls"]
code-intel = [
    "dep:tantivy",
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-go",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-kotlin-codanna",
    "dep:tree-sitter-php",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-lua",
    "dep:tree-sitter-gdscript",
    "dep:crossbeam-channel",
    "dep:ignore",
    "dep:rayon",
    "dep:fastembed",
]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Lint configuration per Pragmatic Rust Guidelines (M-STATIC-VERIFICATION)
[lints.rust]
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

# Patch llama-cpp-sys-2 to explicitly disable AVX2/FMA on older CPUs
# Without this, ggml defaults to AVX2=ON which causes SIGILL on Ivy Bridge
[patch.crates-io]
llama-cpp-sys-2 = { path = "patches/llama-cpp-sys-2" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Cargo lints disabled - multiple dependency versions are from transitive deps
# cargo = { level = "warn", priority = -1 }
# Opt-out of overly strict pedantic lints
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
# These are cosmetic and not worth fixing everywhere
needless_raw_string_hashes = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
items_after_statements = "allow"
uninlined_format_args = "allow"
# Error struct is large due to backtrace, which is intentional
result_large_err = "allow"
# Collapsible if statements can be more readable separated
collapsible_if = "allow"
# map().unwrap_or() is more readable than map_or() in many cases
map_unwrap_or = "allow"
# Redundant closures can be clearer
redundant_closure_for_method_calls = "allow"
# These are stylistic preferences or unavoidable
needless_pass_by_value = "allow"
used_underscore_binding = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_possible_wrap = "allow"
needless_update = "allow"
double_must_use = "allow"
implicit_clone = "allow"
missing_transmute_annotations = "allow"
default_trait_access = "allow"
format_push_string = "allow"
derivable_impls = "allow"
