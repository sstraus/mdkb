[package]
name = "mdkb"
version = "0.1.0"
edition = "2024"
description = "Local markdown knowledge base with semantic search"
license = "MIT"
repository = "https://github.com/user/mdkb"
keywords = ["markdown", "knowledge-base", "search", "mcp"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "mdkb"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
# sqlite-vec = "0.1"  # Phase 3: Vector storage

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "1"

# Frontmatter parsing
gray_matter = "0.2"

# Async (for MCP)
tokio = { version = "1", features = ["full"] }

# MCP protocol
rmcp = { version = "0.3", features = ["server", "transport-io"] }

# File watching
notify = "6"
notify-debouncer-mini = "0.4"

# Errors
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
sha2 = "0.10"
walkdir = "2"
glob = "0.3"
globset = "0.4"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"

# Markdown parsing
pulldown-cmark = "0.12"
regex = "1"

# LLM (Phase 3+)
llama_cpp_rs = { version = "0.3", optional = true }
hf-hub = { version = "0.3", optional = true }
indicatif = { version = "0.17", optional = true }

[features]
default = []
llm = ["llama_cpp_rs", "hf-hub", "indicatif"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
