<svg viewBox="0 0 520 420" role="img" aria-label="A five-stage loop: session ends, find the fix or correction, distil a lesson, promote recurring lessons to priors, inject and settle.">
  <defs>
    <path id="orbit" d="M260,60 A150,150 0 0 1 260,360 A150,150 0 0 1 260,60" />
  </defs>
  <use href="#orbit" class="wire" />
  <circle r="9" class="dot-b"><animateMotion dur="10s" repeatCount="indefinite"><mpath href="#orbit" /></animateMotion></circle>
  <g>
    <circle cx="260" cy="60" r="26" class="box-y" />
    <text x="260" y="66" text-anchor="middle" class="t-title">1</text>
    <circle cx="402.7" cy="163.6" r="26" class="box-y" />
    <text x="402.7" y="169.6" text-anchor="middle" class="t-title">2</text>
    <circle cx="348.2" cy="331.4" r="26" class="box-y" />
    <text x="348.2" y="337.4" text-anchor="middle" class="t-title">3</text>
    <circle cx="171.8" cy="331.4" r="26" class="box-y" />
    <text x="171.8" y="337.4" text-anchor="middle" class="t-title">4</text>
    <circle cx="117.3" cy="163.6" r="26" class="box-y" />
    <text x="117.3" y="169.6" text-anchor="middle" class="t-title">5</text>
  </g>
  <text x="260" y="200" text-anchor="middle" class="t-title">one lesson</text>
  <text x="260" y="220" text-anchor="middle" class="t-sub">per episode, with a trigger</text>
  <text x="260" y="238" text-anchor="middle" class="t-sub">and an outcome</text>
</svg>
