<svg viewBox="0 0 900 150" role="img" aria-label="A session timeline: session start, each prompt, before a tool call, after an edit, and session stop. mdkb acts at each point.">
  <path d="M60,70 H840" class="wire" />
  <g>
    <circle cx="60" cy="70" r="18" class="box" />
    <circle cx="60" cy="70" r="18" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.16;0.2;1" dur="10s" repeatCount="indefinite" /></circle>
    <circle cx="255" cy="70" r="18" class="box" />
    <circle cx="255" cy="70" r="18" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.245;0.265;0.385;0.425;1" dur="10s" repeatCount="indefinite" /></circle>
    <circle cx="450" cy="70" r="18" class="box" />
    <circle cx="450" cy="70" r="18" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.49;0.61;0.65;1" dur="10s" repeatCount="indefinite" /></circle>
    <circle cx="645" cy="70" r="18" class="box" />
    <circle cx="645" cy="70" r="18" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.695;0.715;0.835;0.875;1" dur="10s" repeatCount="indefinite" /></circle>
    <circle cx="840" cy="70" r="18" class="box" />
    <circle cx="840" cy="70" r="18" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.92;0.94;0.99;1" dur="10s" repeatCount="indefinite" /></circle>
  </g>
  <circle r="7" class="dot-b">
    <animateMotion path="M60,70 H840" keyPoints="0;0;1;1" keyTimes="0;0.03;0.93;1" calcMode="linear" dur="10s" repeatCount="indefinite" />
  </circle>
  <g class="t-mono" text-anchor="middle">
    <text x="60" y="124" class="t-mono">SessionStart</text>
    <text x="255" y="124" class="t-mono">UserPromptSubmit</text>
    <text x="450" y="124" class="t-mono">PreToolUse</text>
    <text x="645" y="124" class="t-mono">PostToolUse</text>
    <text x="840" y="124" class="t-mono">Stop</text>
  </g>
</svg>
