# Cargo build configuration for mdkb
#
# CPU Compatibility:
# The llama-cpp-2 crate compiles ggml with native CPU detection by default.
# For older CPUs without AVX2 (like Ivy Bridge i7-3720QM), we need to specify
# the exact target CPU to avoid illegal instruction errors at runtime.
#
# Supported targets:
# - ivybridge: Intel 3rd gen (2012) - AVX, no AVX2
# - haswell: Intel 4th gen (2013) - AVX2, FMA
# - native: Use current CPU features (default, may not work on older CPUs)
#
# To build for maximum compatibility (slower but works everywhere):
# RUSTFLAGS="-C target-cpu=x86-64" cargo build --release

[build]
# Target Ivy Bridge CPU (3rd gen Intel) - has AVX but not AVX2
# This ensures the compiled binary works on older CPUs
rustflags = ["-C", "target-cpu=ivybridge"]
