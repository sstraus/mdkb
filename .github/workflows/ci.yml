name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # A cold debug build of every test binary can fill the runner disk; the
      # linker then dies with SIGBUS instead of a disk-full error. Remove
      # preinstalled SDKs this job does not use, and print the disk use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The ONNX model is restored from the cache when a previous run fetched
      # it; on a miss the warm step tries once and may fail without failing the
      # job. Tests that embed (smoke_embed, cli_update_*, surface_parity) need
      # it, so it runs before them; a missing model fails them by name.
      - name: Cache ONNX embedding model
        id: model-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/fastembed/models--Qdrant--all-MiniLM-L6-v2-onnx
          key: ${{ runner.os }}-fastembed-AllMiniLML6V2

      - name: Warm ONNX model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: cargo run --all-features --quiet -- eval recall --mode embedding --download

      - name: Run tests
        run: cargo test --all-features

      - name: Disk use after tests
        if: always()
        run: df -h / && du -sh target

      # Retrieval eval (docs/retrieval-eval.md). Without the model the eval
      # prints the embedding and hybrid modes as skipped with the reason.

      - name: Retrieval eval
        # No bm25 floor: the absolute recall gate leaves that mode at 0 on this
        # fixture by design, and `committed_fixture_bm25_baseline_holds` pins
        # the exact 0 in the always-running unit suite above. A `--min-recall 0`
        # here would be an assertion that cannot fail.
        run: |
          cargo run --all-features --quiet -- eval recall --mode bm25
          cargo run --all-features --quiet -- eval recall --mode hybrid --min-recall 0.58 --min-precision 1.0
          cargo run --all-features --quiet -- eval recall --mode embedding --min-recall 0.58 --min-precision 1.0
          cargo run --all-features --quiet -- eval judge

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The ONNX model is restored from the cache when a previous run fetched
      # it; on a miss the warm step tries once and may fail without failing the
      # job. Tests that embed (smoke_embed, cli_update_*, surface_parity) need
      # it, so it runs before them; a missing model fails them by name.
      - name: Cache ONNX embedding model
        id: model-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/fastembed/models--Qdrant--all-MiniLM-L6-v2-onnx
          key: ${{ runner.os }}-fastembed-AllMiniLML6V2

      - name: Warm ONNX model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: cargo run --all-features --quiet -- eval recall --mode embedding --download

      - name: Run tests
        run: cargo test --all-features --no-fail-fast

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-features

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-glibc2.35-${{ hashFiles('**/Cargo.lock') }}

      - name: Test GLIBC compatibility check
        run: python3 scripts/tests/test_check_glibc.py

      - name: Build release
        run: cargo build --release

      - name: Check Linux GLIBC compatibility
        run: scripts/check-glibc.sh target/release/mdkb 2.35
